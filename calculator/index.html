<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">
            <input type="text" placeholder="00" id="inputbox">
        <div class="buttons">
            <button class="btn green" onclick="Delete()">AC</button>
            <button class="btn green" onclick="onceRemove()">DEC</button>
            <button class="btn green" onclick="percentage()">%</button>
            <button class="btn green" onclick="appendvalue('/')">/</button>
            <button class="btn" onclick="appendvalue(7)">7</button>
            <button class="btn" onclick="appendvalue(8)">8</button>
            <button class="btn" onclick="appendvalue(9)">9</button>
            <button class="btn green" onclick="appendvalue('*')">*</button>
            <button class="btn" onclick="appendvalue(4)">4</button>
            <button class="btn" onclick="appendvalue(5)">5</button>
            <button class="btn"onclick="appendvalue(6)">6</button>
            <button class="btn green" onclick="appendvalue('-')">-</button>
            <button class="btn" onclick="appendvalue(1)">1</button>
            <button class="btn" onclick="appendvalue(2)">2</button>
            <button class="btn" onclick="appendvalue(3)">3</button>
            <button class="btn green" onclick="appendvalue('+')">+</button>
            <button class="btn" onclick="appendvalue(',')">,</button>
            <button class="btn" onclick="appendvalue(0)">0</button>
            <button class="btn"onclick="appendvalue(.)">.</button>
            <button class="btn cadetblue" onclick="calculate()">=</button>
        </div>
        </div>
    </main>
    <script src="logic.js"></script>
</body>
</html>
