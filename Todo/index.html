<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    flex-direction: column;
    align-items:center;
    padding:25px;
    background:
    radial-gradient(circle at top left,#ffe29f 0%,transparent 35%),
    radial-gradient(circle at bottom right,#ff719a 0%,transparent 35%),
    #faf7f2;
}

.container{
    width:420px;
    min-height: fit-content;
    background:
    radial-gradient(circle at bottom right,#ffe29f 0%,transparent 35%),
    radial-gradient(circle at top left,#ff719a 0%,transparent 35%),
    #faf7f2;
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.5);
    border-radius:20px;
    padding:30px;
    box-shadow:
    0 10px 40px rgba(0,0,0,.12);
}

h2{
    font-size:2.2rem;
    color:#222;
    text-align:center;
    margin-bottom:30px;
    font-weight:700;
}

.input-area{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

.flex{
    display: flex;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    margin: 20px 40px;
}

#input{
    flex:1;
    padding:16px 20px;
    border:none;
    outline:none;
    border-radius:16px;
    background:#ffffff;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
    font-size:16px;
    color: black;
}

#input:focus{
    box-shadow:
    0 0 0 4px rgba(255,113,154,.2),
    0 10px 25px rgba(0,0,0,.08);
}

#addbtn{
    border:none;
    cursor:pointer;
    padding:20px 40px;
    border-radius:16px;
    background-color: #dd8ca3;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
    color:rgb(0, 0, 0);
    font-size:15px;
    font-weight:600;
    transition:.35s;
    /* width: 90px;
    height: 50px;
     */
}

#addbtn:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 30px rgba(0,0,0,.2);
}

ul{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:18px;
}

li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:18px 20px;
    background:#fff;
    border-radius:18px;
    box-shadow:
    0 10px 20px rgba(0,0,0,.07);
    transition:.35s;
    font-size:17px;
    color:#333;
    word-break:break-word;
    margin-top: 20px;
}

li:hover{
    transform:translateY(-3px);
}

#list li button:first-of-type{
    margin-left: auto;
}

li button{
    width:80px;
    height:40px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:white;
    font-size:15px;
    font-weight:bold;
    transition:.3s;
}

li button:first-of-type{
    background:#ff719a;
}

li button:first-of-type:hover{
    transform:scale(1.08);
}

li button:last-of-type{
    background:#ffe29f;
}

li button:last-of-type:hover{
    transform:scale(1.08);
}


@media(max-width:768px){

.container{
padding:25px;
}

h2{
font-size:1.9rem;
}

.input-area{
flex-direction:column;
}

#addbtn{
width:100%;
}

}

@media(max-width:500px){

body{
padding:15px;
}

.container{
padding:18px;
border-radius:22px;
}

h2{
font-size:1.6rem;
}

#input{
padding:14px;
font-size:15px;
}

#addbtn{
padding:14px;
}

li{
padding:15px;
font-size:15px;
}

li button{
width:36px;
height:36px;
font-size:13px;
}

}
</style>


</head>
<body>
    <div class="container">
    <h2>Todo List</h2>
    <div class="flex">
        <input type="text" placeholder="add new task" id="input">
        <button id="addbtn">Add</button>
    </div>
    <ul id="list"></ul>
    </div>
    

    <script>
        const input = document.getElementById("input")
        const list = document.getElementById("list")

        document.getElementById("addbtn").onclick = () => {
            const li = document.createElement("li")
            li.innerText = `${input.value} `
            
            const deleteBtn = document.createElement("button")
            deleteBtn.innerText = "Remove"

            deleteBtn.onclick = () => {
                li.remove()
            }

            const update = document.createElement("button")
            update.innerText = "Update"

            update.onclick = () => {
              li.firstChild.textContent = prompt("edit task", li.firstChild.textContent.trim())
            }
            list.appendChild(li)
            li.appendChild(deleteBtn)
            li.appendChild(update)
            input.value = ""
        }

          
    </script>
</body>
</html>
