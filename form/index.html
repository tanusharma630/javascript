<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    background-color:darkslateblue;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.Container{
    width:430px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 20px 45px rgba(0,0,0,.35);
}

.section{
    display:flex;
    flex-direction:column;
    gap:18px;
}

h1{
    color:white;
    font-size:34px;
    margin-bottom:10px;
}

input{
    width:100%;
    padding:18px;
    border-radius:15px;
    border:none;
    outline:none;
    background:rgba(255,255,255,.18);
    color:white;
    font-size:17px;
}

input::placeholder{
    color:rgba(255,255,255,.7);
}

input[readonly]{
    cursor:default;
}

.buttons{
    display:flex;
    gap:15px;
}

button{
    flex:1;
    padding:16px;
    border:none;
    border-radius:15px;
    background:#6c5ce7;
    color:white;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>
<body>

<div class="Container" id="app">

<form class="section">

<h1>Course Form</h1>

<input type="text" id="name" placeholder="Enter Your Name">

<input type="text" id="course" placeholder="Course Name">

<input type="text" id="address" placeholder="Address">

<input type="email" id="email" placeholder="Email">

<div class="buttons">

<button type="button" id="btn">Submit</button>

<button type="button" id="fetchdata">Show Data</button>

</div>

</form>

</div>

<script>


document.getElementById("btn").addEventListener("click",()=>{

    const userData={

        name:document.getElementById("name").value,
        course:document.getElementById("course").value,
        address:document.getElementById("address").value,
        email:document.getElementById("email").value

    };

    localStorage.setItem("userData",JSON.stringify(userData));

    alert("Data Saved Successfully");

});

document.getElementById("fetchdata").addEventListener("click",()=>{

    const data=JSON.parse(localStorage.getItem("userData"));

    if(!data){
        alert("No Data Found");
        return;
    }

    document.getElementById("app").innerHTML=`

    <div class="section">

    <h1>Student Details</h1>

    <input type="text" value="${data.name}" readonly>

    <input type="text" value="${data.course}" readonly>

    <input type="text" value="${data.address}" readonly>

    <input type="text" value="${data.email}" readonly>

    <div class="buttons">
        <button onclick="location.reload()">Back</button>
    </div>

    </div>

    `;

});

</script>

</body>
</html>
